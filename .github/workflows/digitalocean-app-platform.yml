name: DigitalOcean App Platform CI/CD

on:
  workflow_dispatch:
    inputs:
      media_url:
        description: Base URL media (content/media) is served from
        required: true
        default: https://dzimchuk.net/media/

concurrency:
  group: digitalocean-app-platform
  cancel-in-progress: false

env:
  DEPLOY_BRANCH: do-site

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        node-version: [24]
    steps:
      - uses: actions/checkout@v6
        with:
            submodules: true
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
            node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run production -- --media-url="$MEDIA_URL"
        env:
          MEDIA_URL: ${{ inputs.media_url }}
      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
            name: do-build-artifact
            path: build

  deploy:
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Download build artifacts
        uses: actions/download-artifact@v6
        with:
          name: do-build-artifact
          path: ${{ runner.temp }}/site
      - name: Publish to deploy branch
        working-directory: ${{ runner.temp }}/site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b "$DEPLOY_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy $GITHUB_SHA"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$DEPLOY_BRANCH"
      - name: Deploy to App Platform
        uses: digitalocean/app_action/deploy@v2
        env:
          # The action expands ${VAR} references in the app spec from the environment and would
          # blank out App Platform's ${STARTER_DOMAIN}; map it to itself to keep it intact.
          STARTER_DOMAIN: ${STARTER_DOMAIN}
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          app_spec_location: .do/app.yaml
          print_build_logs: true
          print_deploy_logs: true
